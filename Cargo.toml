[package]
name = "dscan11"
version = "0.9.0"
edition = "2024"
description = "Cached Windows drive scanner for fast CLI storage cleanup views"
license = "MIT"

[[bin]]
name = "dscan11"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
strip = true

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }
